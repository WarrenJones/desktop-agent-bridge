<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Bidirectional handoff lifecycle</title>
  <desc id="desc">Two execution sequences showing Codex to Claude and Claude to Codex review handoffs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#059669"/></marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .panel { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .lane { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .step { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .num { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <rect width="1400" height="920" fill="#f8fafc"/>
  <text x="55" y="48" class="title">One command, two intentionally different lifecycles</text>
  <text x="55" y="74" class="subtitle">The shared contract is the request/result envelope. Submission, completion detection, and Desktop opening are target-specific.</text>

  <rect x="45" y="105" width="1310" height="355" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="70" y="138" class="panel">A · Codex Desktop → Claude Desktop</text>
  <text x="70" y="161" class="small">Native UI submission + persisted transcript correlation</text>

  <g>
    <text x="135" y="202" class="lane" text-anchor="middle">SOURCE CODEX</text>
    <text x="385" y="202" class="lane" text-anchor="middle">DAB CORE</text>
    <text x="650" y="202" class="lane" text-anchor="middle">JXA ADAPTER</text>
    <text x="930" y="202" class="lane" text-anchor="middle">CLAUDE DESKTOP</text>
    <text x="1210" y="202" class="lane" text-anchor="middle">LOCAL TRANSCRIPT</text>
    <path d="M135 216 V425 M385 216 V425 M650 216 V425 M930 216 V425 M1210 216 V425" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 6"/>
  </g>

  <circle cx="135" cy="245" r="14" fill="#2563eb"/><text x="135" y="245" class="num">1</text>
  <path d="M151 245 H369" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/><text x="182" y="237" class="step">skill calls dab handoff --context-mode auto</text>
  <circle cx="385" cy="285" r="14" fill="#2563eb"/><text x="385" y="285" class="num">2</text>
  <path d="M401 285 H634" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/><text x="435" y="277" class="step">normalize source rollout + build envelope</text>
  <circle cx="650" cy="325" r="14" fill="#2563eb"/><text x="650" y="325" class="num">3</text>
  <path d="M666 325 H914" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/><text x="704" y="317" class="step">create project session · Manual · send</text>
  <circle cx="930" cy="365" r="14" fill="#2563eb"/><text x="930" y="365" class="num">4</text>
  <path d="M946 365 H1194" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/><text x="1002" y="357" class="step">persist user/assistant JSONL events</text>
  <circle cx="1210" cy="405" r="14" fill="#2563eb"/><text x="1210" y="405" class="num">5</text>
  <path d="M1194 405 H401" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="720" y="397" class="step">first same-session text end_turn matching cwd + request ID</text>
  <path d="M369 432 H151" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="186" y="424" class="step">{ sessionId, result }</text>

  <rect x="45" y="490" width="1310" height="355" rx="20" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="70" y="523" class="panel">B · Claude Desktop → Codex Desktop</text>
  <text x="70" y="546" class="small">Native Claude history import + read-only resume + best-effort deep link</text>

  <g>
    <text x="135" y="587" class="lane" text-anchor="middle">SOURCE CLAUDE</text>
    <text x="385" y="587" class="lane" text-anchor="middle">DAB CORE</text>
    <text x="650" y="587" class="lane" text-anchor="middle">CODEX RUNTIME</text>
    <text x="930" y="587" class="lane" text-anchor="middle">CODEX THREAD</text>
    <text x="1210" y="587" class="lane" text-anchor="middle">CODEX DESKTOP</text>
    <path d="M135 601 V810 M385 601 V810 M650 601 V810 M930 601 V810 M1210 601 V810" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 6"/>
  </g>

  <circle cx="135" cy="630" r="14" fill="#059669"/><text x="135" y="630" class="num">1</text>
  <path d="M151 630 H369" stroke="#059669" stroke-width="2.5" marker-end="url(#green)"/><text x="182" y="622" class="step">hook path + dab handoff --context-mode auto</text>
  <circle cx="385" cy="670" r="14" fill="#059669"/><text x="385" y="670" class="num">2</text>
  <path d="M401 670 H634" stroke="#059669" stroke-width="2.5" marker-end="url(#green)"/><text x="438" y="662" class="step">externalAgentConfig/import + ledger ID</text>
  <circle cx="650" cy="710" r="14" fill="#059669"/><text x="650" y="710" class="num">3</text>
  <path d="M666 710 H914" stroke="#059669" stroke-width="2.5" marker-end="url(#green)"/><text x="716" y="702" class="step">exec resume · read-only sandbox</text>
  <circle cx="930" cy="750" r="14" fill="#059669"/><text x="930" y="750" class="num">4</text>
  <path d="M914 750 H401" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="560" y="742" class="step">thread.started + final agent_message</text>
  <circle cx="385" cy="790" r="14" fill="#059669"/><text x="385" y="790" class="num">5</text>
  <path d="M401 790 H1194" stroke="#059669" stroke-width="2.5" marker-end="url(#green)"/><text x="683" y="782" class="step">open codex://threads/&lt;id&gt; (best effort)</text>
  <path d="M369 820 H151" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="170" y="812" class="step">result survives deep-link failure</text>

  <rect x="45" y="870" width="1310" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="700" y="890" class="small" text-anchor="middle">Shared terminal states: validate → submit → await completion → normalize result → return, all within one timeout budget.</text>
</svg>

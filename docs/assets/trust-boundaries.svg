<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Trust boundaries and review-only guarantees</title>
  <desc id="desc">The local trust boundaries for repository access, conversational context, credentials, and target permissions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .group { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: .6px; }
      .boxTitle { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .text { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .badge { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="55" y="50" class="title">Trust is local, but the two targets do not have equal enforcement</text>
  <text x="55" y="76" class="subtitle">The bridge minimizes transferred context and stores no credentials. Only the Codex path currently has an OS/process-enforced read-only sandbox.</text>

  <rect x="45" y="110" width="1310" height="650" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="142" class="group">LOCAL MAC · EXISTING USER LOGIN STATE</text>

  <rect x="75" y="170" width="310" height="220" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="100" y="205" class="boxTitle">Source conversation</text>
  <text x="100" y="235" class="text">Allowed across the bridge</text>
  <text x="100" y="260" class="text">• task and review scope</text>
  <text x="100" y="283" class="text">• decisions and constraints</text>
  <text x="100" y="306" class="text">• unresolved questions</text>
  <text x="100" y="340" class="text">Explicitly excluded by skill policy</text>
  <text x="100" y="365" class="small">full transcript · secrets · env · large diffs</text>

  <rect x="445" y="170" width="420" height="220" rx="18" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="470" y="205" class="boxTitle">Bridge process</text>
  <rect x="730" y="187" width="105" height="22" rx="11" fill="#cffafe"/>
  <text x="782" y="202" class="badge" fill="#0e7490" text-anchor="middle">NO DAEMON</text>
  <text x="470" y="238" class="text">• random delimiter and request ID</text>
  <text x="470" y="263" class="text">• untrusted-data prompt framing</text>
  <text x="470" y="288" class="text">• one end-to-end timeout budget</text>
  <text x="470" y="313" class="text">• normalized result contract</text>
  <text x="470" y="345" class="small">No token vault, remote service, database,</text>
  <text x="470" y="365" class="small">telemetry, or automatic secret scanner.</text>

  <rect x="925" y="170" width="385" height="220" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="950" y="205" class="boxTitle">Shared repository · cwd</text>
  <text x="950" y="238" class="text">Both reviewers read files directly.</text>
  <text x="950" y="266" class="text">Why this is better than copying code:</text>
  <text x="950" y="291" class="text">• no stale or truncated diff snapshot</text>
  <text x="950" y="316" class="text">• project rules stay discoverable</text>
  <text x="950" y="341" class="text">• file/line references remain valid</text>
  <text x="950" y="368" class="small">Current gap: cwd is not allowlisted.</text>

  <path d="M385 280 H429" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M865 280 H909" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="75" y="440" width="570" height="260" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="100" y="475" class="boxTitle">Codex target boundary</text>
  <rect x="474" y="457" width="140" height="23" rx="11" fill="#dbeafe"/>
  <text x="544" y="473" class="badge" fill="#1d4ed8" text-anchor="middle">HARD READ-ONLY</text>
  <text x="100" y="510" class="text">Enforcement</text>
  <text x="100" y="535" class="text">• --sandbox read-only</text>
  <text x="100" y="558" class="text">• user config ignored</text>
  <text x="100" y="581" class="text">• MCP, plugins, and apps disabled</text>
  <text x="100" y="614" class="text">Credential behavior</text>
  <text x="100" y="639" class="text">• reuses Desktop runtime login</text>
  <text x="100" y="662" class="text">• bridge never receives a token</text>
  <text x="100" y="685" class="small">Deep-link failure does not discard the completed review.</text>

  <rect x="705" y="440" width="605" height="260" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="730" y="475" class="boxTitle">Claude target boundary</text>
  <rect x="1111" y="457" width="167" height="23" rx="11" fill="#ffedd5"/>
  <text x="1194" y="473" class="badge" fill="#c2410c" text-anchor="middle">SOFT REVIEW GUARD</text>
  <text x="730" y="510" class="text">Enforcement</text>
  <text x="730" y="535" class="text">• prompt prohibits writes and Git mutation</text>
  <text x="730" y="558" class="text">• UI forced to Manual permission mode</text>
  <text x="730" y="581" class="text">• user must reject any write approval</text>
  <text x="730" y="614" class="text">Credential behavior</text>
  <text x="730" y="639" class="text">• reuses Claude Desktop login</text>
  <text x="730" y="662" class="text">• bridge reads only local transcript files</text>
  <text x="730" y="685" class="small">Manual is not an OS-level sandbox; this is the primary residual risk.</text>

  <path d="M655 390 V424 H360 V440" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M655 390 V424 H1005 V440" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="75" y="722" width="1235" height="22" rx="11" fill="#f1f5f9"/>
  <text x="692" y="738" class="small" text-anchor="middle">Review-only means no requested repository mutation; it does not claim total process isolation on the Claude path.</text>
</svg>
